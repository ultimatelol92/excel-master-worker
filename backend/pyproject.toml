[project]
name = "excel-master-worker"
version = "1.0.0"
description = "AI-powered Excel/Macro Master Worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.50.0",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "anthropic>=0.40.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
